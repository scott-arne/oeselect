[build-system]
requires = ["scikit-build-core>=0.8", "swig>=4.0"]
build-backend = "scikit_build_core.build"

[project]
name = "oeselect"
version = "1.4.1"
description = "High-performance PyMOL selection language for OpenEye Toolkits"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["chemistry", "molecular selection", "pymol", "openeye", "cheminformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The floor is set by openeye-toolkits, not by anything in this package: 2026.1
# is the first release with py314 wheels and the first to drop py310, and the
# extension links its OpenEye shared libraries by versioned soname, so the
# runtime toolkit has to be the one the wheel was built against.
requires-python = ">=3.11"
dependencies = ["openeye-toolkits>=2026.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "vrzn>=0.1.0"]

[tool.scikit-build]
cmake.version = ">=3.21"
cmake.build-type = "Release"
build.targets = ["oeselect_python"]
build-dir = "build/{wheel_tag}"
wheel.install-dir = "."
wheel.py-api = "cp310"
wheel.exclude = ["**.pyc", "**/__pycache__", "*.a", "CMakeFiles/**"]
logging.level = "INFO"
strict-config = false

[tool.scikit-build.cmake.define]
OESELECT_BUILD_TESTS = "OFF"
OESELECT_BUILD_PYTHON = "ON"
OPENEYE_USE_SHARED = "ON"
OESELECT_USE_STABLE_ABI = "ON"
OESELECT_UNIVERSAL2 = "OFF"

# =============================================================================
# TOML-driven build configuration for scripts/build_python.py
# =============================================================================
# This section is read by build_python.py to parameterize the build.
# The script itself is identical across all projects — only this config changes.
[tool.oe-build]
package-name = "oeselect"
cmake-test-flag = "OESELECT_BUILD_TESTS"
rpath-strategy = "platform"  # "platform" = @loader_path/../openeye/libs/{platform}, "simple" = @loader_path

# OpenEye libraries that are expected to be missing from delocate
# (they are provided at runtime by openeye-toolkits, not bundled in the wheel)
expected-missing-libs = [
    "liboechem", "liboesystem", "liboeplatform",
    "liboemath", "liboebio", "liboegrid", "libzstd",
]

# Additional CMake defines passed during wheel build (beyond the standard ones)
[tool.oe-build.extra-cmake-defines]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.ruff]
extend-exclude = [
    "python/oeselect/_build_info.py",
    "python/oeselect/oeselect.py",
]

[tool.ruff.lint.per-file-ignores]
"python/oeselect/__init__.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = [
    "python/oeselect/_build_info.py",
    "python/oeselect/oeselect.py",
]

[[tool.mypy.overrides]]
module = [
    "oeselect._build_info",
    "oeselect.oeselect",
]
ignore_errors = true
