[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "oeselect"
version = "1.4.0"
description = "High-performance PyMOL selection language for OpenEye Toolkits"
requires-python = ">=3.11"
dependencies = ["openeye-toolkits>=2026.1"]

[tool.setuptools]
packages = ["oeselect"]
